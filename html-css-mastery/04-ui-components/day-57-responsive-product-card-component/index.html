<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <!-- Product Card Component -->
        <div class="product-card">
            <img src="https://via.placeholder.com/300x200/cccccc/ffffff?text=Product+Image" alt="Stylish Product" class="product-card__image">
            <div class="product-card__details">
                <h3 class="product-card__title">Premium Wireless Headphones</h3>
                <p class="product-card__description">Experience immersive sound with our lightweight and comfortable wireless headphones. Perfect for daily use.</p>
                <div class="product-card__price-info">
                    <span class="product-card__current-price">$129.99</span>
                    <span class="product-card__old-price">$149.99</span>
                </div>
                <button class="product-card__button">Add to Cart</button>
            </div>
        </div>
        <!-- End Product Card Component -->
    </main>
</body>
</html>
