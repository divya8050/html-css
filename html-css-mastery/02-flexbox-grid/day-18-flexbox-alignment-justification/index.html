<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Alignment & Justification</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Day 18: Flexbox Alignment</h1>
    </header>

    <main class="flex-container-wrapper">
        <section class="flex-section">
            <h2>Justify Content: Flex Start (default)</h2>
            <div class="flex-container justify-start">
                <div class="flex-item">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item">3</div>
            </div>
        </section>

        <section class="flex-section">
            <h2>Justify Content: Center</h2>
            <div class="flex-container justify-center">
                <div class="flex-item">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item">3</div>
            </div>
        </section>

        <section class="flex-section">
            <h2>Justify Content: Space Between</h2>
            <div class="flex-container justify-space-between">
                <div class="flex-item">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item">3</div>
            </div>
        </section>

        <section class="flex-section">
            <h2>Align Items: Center</h2>
            <div class="flex-container align-center">
                <div class="flex-item item-tall">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item item-short">3</div>
            </div>
        </section>

        <section class="flex-section">
            <h2>Align Items: Flex End</h2>
            <div class="flex-container align-end">
                <div class="flex-item item-tall">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item item-short">3</div>
            </div>
        </section>
    </main>

    <footer>
        <p>Day 18 of 180 - Flexbox Alignment & Justification</p>
    </footer>
</body>
</html>
