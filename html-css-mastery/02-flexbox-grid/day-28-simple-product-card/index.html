<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 28: Simple Product Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main content area for product cards -->
    <main class="container">
        <article class="product-card">
            <img src="https://via.placeholder.com/150" alt="Placeholder Product Image" class="product-card__image">
            <div class="product-card__content">
                <h2 class="product-card__title">Awesome Product Title</h2>
                <p class="product-card__description">Discover the amazing features of this product. It's designed to make your life easier and more enjoyable.</p>
                <span class="product-card__price">$29.99</span>
                <button class="product-card__button">Add to Cart</button>
            </div>
        </article>

        <article class="product-card">
            <img src="https://via.placeholder.com/150" alt="Another Product Image" class="product-card__image">
            <div class="product-card__content">
                <h2 class="product-card__title">Another Great Item</h2>
                <p class="product-card__description">This item offers incredible value and performance. Perfect for everyday use.</p>
                <span class="product-card__price">$49.50</span>
                <button class="product-card__button">Buy Now</button>
            </div>
        </article>
    </main>
</body>
</html>
