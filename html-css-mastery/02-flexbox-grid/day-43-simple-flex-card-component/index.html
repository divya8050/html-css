<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 43: Simple Flex Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="main-content">
        <!-- Simple Card Component built with HTML5 and Flexbox -->
        <article class="card">
            <img src="https://via.placeholder.com/300x200/4a90e2/ffffff?text=Card+Image" alt="Placeholder card image" class="card__image">
            <div class="card__content">
                <h2 class="card__title">A Modern Flex Card</h2>
                <p class="card__description">This is a simple card component designed with modern HTML5 and CSS3, utilizing Flexbox for layout and clean styling.</p>
                <button class="card__button">Learn More</button>
            </div>
        </article>
    </main>
</body>
</html>
